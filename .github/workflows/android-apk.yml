name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Google retired the old SDK 'tools' package. Do not request it.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure Firebase if secret exists
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_B64" ]; then
            printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
            python3 - <<'PY'
          import json
          d=json.load(open('app/google-services.json'))
          assert d.get('project_info') and d.get('client'), 'Invalid Firebase config'
          print('Firebase client config validated (contents not printed).')
          PY
          else
            echo 'No Firebase config: APK builds, remote push cannot activate until configured.'
          fi
      - name: Static checks (server extension)
        run: |
          node --check server-integration/INSTALL-ROOT/server.mjs
          node --check server-integration/INSTALL-ROOT/student/app.js
          node --test tests/*.test.mjs
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madreseyar-Student-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
